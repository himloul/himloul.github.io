<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hamza Imloul</title>
  <meta name="description" content="Personal index and portfolio.">
  <link rel="canonical" href="https://himloul.github.io/">

  <meta property="og:title" content="Hamza Imloul">
  <meta property="og:description" content="Personal index and portfolio.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://himloul.github.io/">

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri&family=EB+Garamond:wght@400;500&display=swap">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><style>text{font:italic 700 52px 'EB Garamond',ui-serif,Georgia,serif;fill:%230969da}@media(prefers-color-scheme:dark){text{fill:%2358a6ff}}</style><text x='50%' y='52%' dominant-baseline='central' text-anchor='middle'>h.i.</text></svg>">
  <style>
    :root { color-scheme: light dark; --bg: light-dark(#fff, #000); --text: light-dark(#000, #fff); --muted: light-dark(#666, #999); --accent: light-dark(#0969da, #58a6ff); --hover: light-dark(#f5f5f5, #111); }
    * { box-sizing: border-box; margin: 0; }
    body { min-height: 100dvh; display: grid; place-content: center; padding: 2rem 1.5rem; background: var(--bg); color: var(--text); font: 1.15rem/1.5 "EB Garamond", ui-serif, Georgia, "Times New Roman", serif; -webkit-font-smoothing: antialiased; }
    main { width: 100%; max-width: 400px; }
    header { margin-bottom: 1.5rem; }
    h1 { font-size: 2.25rem; font-weight: 400; letter-spacing: -0.02em; }
    header p { font-family: "Amiri", "Geeza Pro", "Times New Roman", serif; font-size: 1.35rem; color: var(--muted); margin-top: 0.15rem; }
    nav ul { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 0.25rem; }
    a { display: flex; align-items: center; justify-content: space-between; padding: 0.6rem 0.8rem; margin-inline: -0.8rem; color: var(--accent); text-decoration: none; font-weight: 500; border-radius: 8px; transition: 0.15s; }
    a:hover { color: var(--text); background: var(--hover); }
    a:active { transform: scale(0.98); }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    a::after { content: "↗"; font-size: 0.85em; opacity: 0.5; transition: 0.15s; }
    a:hover::after { opacity: 1; transform: translate(2px, -2px); }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Hamza Imloul</h1>
      <p lang="ar" dir="rtl">حمزة إملول</p>
    </header>
    <nav>
      <ul>
        <li><a href="https://himloul.pages.dev/" target="_blank" rel="noopener">Website</a></li>
        <li><a href="https://github.com/himloul" target="_blank" rel="noopener">GitHub</a></li>
        <li><a href="https://www.behance.net/himloul" target="_blank" rel="noopener">Behance</a></li>
      </ul>
    </nav>
  </main>
</body>
</html>
