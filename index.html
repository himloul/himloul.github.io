  <style>
    :root { color-scheme: light dark; --bg: #fff; --text: #000; --muted: #666; --accent: #0969da; --hover: #f5f5f5; }

    * { box-sizing: border-box; margin: 0; }
    body { min-height: 100dvh; display: grid; place-content: center; padding: 2rem 1.5rem; background: var(--bg); color: var(--text); font: 1.15rem/1.5 "EB Garamond", ui-serif, Georgia, "Times New Roman", serif; -webkit-font-smoothing: antialiased; }

    nav ul { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 0.25rem; }
    a { display: flex; align-items: center; justify-content: space-between; padding: 0.6rem 0.8rem; margin-inline: -0.8rem; color: var(--accent); text-decoration: none; font-weight: 500; border-radius: 8px; transition: color 0.15s, background-color 0.15s, opacity 0.15s, transform 0.15s; }
    a:hover { color: var(--text); background: var(--hover); }
    a:active { transform: scale(0.98); }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    nav a::after { content: "↗"; font-size: 0.85em; opacity: 0.5; transition: opacity 0.15s, transform 0.15s; }
    nav a:hover::after { opacity: 1; transform: translate(2px, -2px); }
    @media (prefers-reduced-motion: reduce) { * { transition: none; } }
